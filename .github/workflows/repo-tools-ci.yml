# Managed by repo-tools (bin/repo-ci). Local edits will be overwritten.
# Customise via .github/repo-tools.conf instead: https://github.com/InboundFrog/repo-tools
name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: InboundFrog/repo-tools/.github/workflows/python.yml@claude/eloquent-davinci-i6x2ab-replace-workflows
    strategy:
      fail-fast: false
      matrix:
        dir: ['.']
        os: ['ubuntu-latest']
    with:
      working-directory: ${{ matrix.dir }}
      runs-on: ${{ matrix.os }}
      lint-command: 'uvx ruff check --output-format=github --target-version py311 .'

  rust:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@claude/eloquent-davinci-i6x2ab-replace-workflows
    strategy:
      fail-fast: false
      matrix:
        dir: ['.']
        os: ['ubuntu-latest', 'macos-latest']
    with:
      working-directory: ${{ matrix.dir }}
      runs-on: ${{ matrix.os }}
      build-command: 'cargo build --release --locked'
      extra-command: 'ci/smoke.sh'
      artifact-name: 'rust'
      artifact-paths: 'target/release/tvmap tvmap-out/'

  shell:
    uses: InboundFrog/repo-tools/.github/workflows/shell.yml@claude/eloquent-davinci-i6x2ab-replace-workflows
    strategy:
      fail-fast: false
      matrix:
        dir: ['.']
        os: ['ubuntu-latest']
    with:
      working-directory: ${{ matrix.dir }}
      runs-on: ${{ matrix.os }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [python, rust, shell]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
