# Settings for the CI and Dependabot files generated by repo-tools
# (https://github.com/InboundFrog/repo-tools). Edit this, then re-run
# bin/repo-ci and bin/repo-dependabot rather than editing those files.

# Build and test on both, as the hand-written ci.yml did.
OS=ubuntu-latest, macos-latest
# The Python helper script and ci/*.sh only need linting once.
PYTHON_OS=ubuntu-latest
SHELL_OS=ubuntu-latest

# tools/freetv_maps.py needs Python 3.11+ (tomllib), so lint for that.
PYTHON_LINT=uvx ruff check --output-format=github --target-version py311 .

# Release build, CLI smoke test, then keep the binary and the smoke-test output.
RUST_BUILD=cargo build --release --locked
RUST_EXTRA=ci/smoke.sh
RUST_ARTIFACTS=target/release/tvmap tvmap-out/

# Superseded by the generated repo-tools-ci.yml.
REPLACE_WORKFLOWS=ci.yml
