# Perth (WA) free-to-air DVB-T services -> Australian logical channel numbers.
#
# Keyed on (onid, tsid, sid): original network ID, transport stream ID and
# service ID. These come from the broadcast and survive a rescan. `name` is the
# name the TV showed when this map was made; tvmap flags any service whose
# current name differs a lot from it.
#
# Numbers taken from Wikipedia's "List of digital television channels in
# Australia" (metropolitan tables), October 2026, with one change: where a
# network has an SD and an HD copy of its main channel, the HD copy gets the
# main number (ABC HD on 2, SBS HD on 3; the SD copies move to 20 and 30).
# Where several services carry the same programme (e.g. "7 Perth" x3), the
# lowest service ID gets the main number. They're simulcasts, so a swap only
# changes which copy you land on.
#
# Per channel:
#   number = N      set the channel number (omit to keep whatever the TV has)
#   hidden = true   remove from the channel list
#   skip   = true   still reachable by typing the number, skipped by CH+/CH-

region = "Perth, WA"

