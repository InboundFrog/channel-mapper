[package]
name = "tvmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Renumber channels in a Samsung Tizen (J/K/M/N series) channel-list export"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
tempfile = "3"
toml = "1.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
